name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive
      # -backend=false: valida sintaxe, tipos e providers sem S3 nem credenciais. O plan e o CD.
      - name: init (sem backend)
        run: terraform -chdir=terraform init -backend=false
      - name: validate
        run: terraform -chdir=terraform validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done

  contratos:
    # Contratos com oficina-infra-k8s, oficina-lambda-auth e oficina-app (docs/contratos.md):
    # nomes de SSM lidos/publicados, .address (sem porta), SG sem regras inline, segredo em
    # texto puro, usuario/banco/porta fixos. Um validate verde nao pega nada disso.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: verificar-contratos
        run: ./scripts/verificar-contratos.sh

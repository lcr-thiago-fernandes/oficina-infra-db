name: CD

# Infraestrutura tem ambiente unico (design, secao 7): develop -> plan; main -> apply.
# Pre-requisitos: oficina-infra-k8s/scripts/bootstrap.sh (bucket, lock, OIDC, role infra) e o
# apply do oficina-infra-k8s (este repositorio le /oficina/network/* do SSM; sem eles o plan
# falha no data source — comportamento esperado, decisao D9).
on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-infra-db
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7

      # So main e develop tem acao definida; qualquer outra ref (workflow_dispatch) falha alto.
      - name: Definir acao
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "main" ]; then
            echo "ACAO=apply" >> "$GITHUB_ENV"
          elif [ "$REF_NAME" = "develop" ]; then
            echo "ACAO=plan" >> "$GITHUB_ENV"
          else
            echo "ERRO: ref '$REF_NAME' nao tem acao de deploy (main=apply, develop=plan)." >&2
            exit 1
          fi

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ env.ACAO == 'apply' }}
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      # Identificadores que os outros repositorios leem do SSM (nao sao segredos; a senha
      # nunca aparece: fica so em oficina/db_password).
      - name: Outputs para os outros repositorios
        if: ${{ env.ACAO == 'apply' }}
        run: |
          terraform -chdir=terraform output db_endpoint
          terraform -chdir=terraform output db_security_group_id
          terraform -chdir=terraform output db_engine_version_actual
